<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Outfit:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="./styles.css">
  

  <title>Frontend Mentor | QR code component</title>
</head>

<body>
  <main role="main">
    <div class="card">
    <img src="images/image-qr-code.png" alt="QRcode to Frontend Mentor website">
    <div class="text-container">
      <h2>
        Improve your front-end skills by building projects
      </h2>
      <p>
        Scan the QR code to visit Frontend Mentor and take your skills to the next level
      </p>
    </div>
  </div>
  </main>
</body>
</html>
